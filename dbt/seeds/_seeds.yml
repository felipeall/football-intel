version: 2

seeds:
  - name: club_source_ids
    description: >
      Canonical Clubs and each source's ID for them, mapped by hand. Club names and IDs only,
      no scraped payloads (ADR 4). A club new to the league needs a row here.
    columns:
      - name: club_id
        data_tests: [unique, not_null]
      - name: sofascore_team_id
        data_tests: [unique, not_null]
      - name: understat_team_id
        data_tests: [unique, not_null]
      - name: transfermarkt_club_id
        data_tests: [unique, not_null]
