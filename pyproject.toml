[project]
name = "football-intel"
version = "0.1.0"
description = "Durable football data ingestion with Temporal, and an AI scouting agent on top."
readme = "README.md"
license = "MIT"
authors = [{ name = "Felipe Allegretti" }]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "import-linter",
    "langfuse==4.17.0",
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.importlinter]
root_package = "football_intel"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Provider SDKs only inside agent.providers.<provider> (ADR 24)"
type = "forbidden"
source_modules = ["football_intel"]
forbidden_modules = [
    "anthropic",
    "cohere",
    "litellm",
    "mistralai",
    "ollama",
    "openai",
]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "football_intel.agent.providers.anthropic -> anthropic",
    "football_intel.agent.providers.anthropic.** -> anthropic",
]
